[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darukaa-earth-backend"
version = "1.0.0"
description = "Darukaa.Earth AI Biodiversity Intelligence — Environmental Reasoning Engine"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "pydantic",
  "pydantic-settings",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
